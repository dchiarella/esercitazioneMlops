name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installa prima la versione leggera di torch, mi ha aiutato gemini, se lo mettevo nel requirement non usava la leggera ma quella intera
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Poi installa tutto il resto dal file requirements
        pip install -r requirements.txt


    - name: Run unit tests
      run: |
        pytest


    - name: Validate model accuracy
      run: |
        python validate.py

  
    - name: Build Docker image
      run: |
        docker build -t sentiment-api .

    
    - name: Login to HuggingFace
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        pip install huggingface_hub
        huggingface-cli login --token $HF_TOKEN

   
    - name: Push to HuggingFace Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "domenico.chiarella87@ifm.it"
        git config --global user.name "github-actions"
        
        # 1. Cloniamo usando il token nell'URL (autenticazione automatica)
        git clone https://oauth2:$HF_TOKEN@huggingface.co/spaces/domenico1987/test hf_space
        
        # 2. Copiamo i file (escludendo .git e la cartella stessa hf_space)
        rsync -av --exclude='.git' --exclude='hf_space' ./ hf_space/
        
        # 3. Entriamo nella cartella giusta, aggiungiamo e pushiamo
        cd hf_space
        git add .
        # Verifichiamo se ci sono modifiche prima di fare il commit per evitare errori
        git diff-index --quiet HEAD || git commit -m "Auto-deploy from GitHub Actions CI"
        git push
        
