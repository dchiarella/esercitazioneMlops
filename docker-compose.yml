## Il docker compose impacchetta  e avvia in dei container l'app che espone il modello, il client che la utilizza ma anche prometheus e grafana

version: "3.9"

services:

  api:
    build: .
    container_name: sentiment_api
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  load-test:
    build:
      context: .
      dockerfile: Dockerfile.load
    depends_on:
      - api
    restart: "no"
